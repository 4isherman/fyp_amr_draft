# pointcloud_to_laserscan node params
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_footprint      # transform cloud into this frame first
    transform_tolerance: 0.01
    min_height: 0.10                  # ignore anything below 10cm (ground)
    max_height: 1.0                   # ignore anything above 1.0m (ceiling/overhangs)
    angle_min: -3.14159               # -180°
    angle_max:  3.14159               #  180°
    angle_increment: 0.00436          # ~0.25° resolution
    scan_time: 0.1
    range_min: 0.1
    range_max: 25.0
    use_inf: true
    inf_epsilon: 1.0