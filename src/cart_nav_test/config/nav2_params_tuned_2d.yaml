behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin" # In Iron and older versions, "/" was used instead of "::"
    backup:
      plugin: "nav2_behaviors::BackUp" # In Iron and older versions, "/" was used instead of "::"
    wait:
      plugin: "nav2_behaviors::Wait" # In Iron and older versions, "/" was used instead of "::"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0



collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint" #"base_link"
    odom_frame_id: "odom"
    # cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # enable_stamped_cmd_vel: true
    enable_stamped_cmd_vel: false
    use_realtime_priority: false
    # polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    polygons: ["PolygonStop", "PolygonSlow"]
    # PolygonStop:
    #   type: "circle"
    #   radius: 0.22 #0.35 # 0.235
    #   action_type: "stop"
    #   min_points: 4
    #   visualize: true
    #   polygon_pub_topic: "polygon_stop"
    #   enabled: true
    # PolygonSlow:
    #   type: "circle"
    #   radius: 0.25 #0.45
    #   action_type: "slowdown"
    #   min_points: 4
    #   slowdown_ratio: 0.70
    #   visualize: true
    #   polygon_pub_topic: "polygon_slowdown"
    #   enabled: true
    PolygonStop:
      type: "polygon"
      # points: "[[0.5, 0.5], [0.6, -0.6], [-0.7, -0.7], [-0.235, 0.235]]"
      points: "[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: "[[0.26, 0.26], [0.26, -0.26], [-0.26, -0.26], [-0.26, 0.26]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.45
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      source_timeout: 0.2
      type: "scan"
      topic: "/scan"
      min_height: 0.1                     # ← filters ground returns
      max_height: 2.0
      enabled: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

