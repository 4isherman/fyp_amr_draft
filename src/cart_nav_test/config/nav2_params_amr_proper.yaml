collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint" #"base_link"
    odom_frame_id: "odom"
    # cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0 #0.5
    source_timeout: 5.0
    # source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # enable_stamped_cmd_vel: true
    enable_stamped_cmd_vel: false
    use_realtime_priority: false
    # polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    polygons: ["PolygonStop", "PolygonSlow"]
    # PolygonStop:
    #   type: "circle"
    #   radius: 0.22 #0.35 # 0.235
    #   action_type: "stop"
    #   min_points: 4
    #   visualize: true
    #   polygon_pub_topic: "polygon_stop"
    #   enabled: true
    # PolygonSlow:
    #   type: "circle"
    #   radius: 0.25 #0.45
    #   action_type: "slowdown"
    #   min_points: 4
    #   slowdown_ratio: 0.70
    #   visualize: true
    #   polygon_pub_topic: "polygon_slowdown"
    #   enabled: true
    PolygonStop:
      type: "polygon"
      points: "[[0.8, 0.58], [0.8, -0.58], [-0.8, -0.58], [-0.8, 0.58]]"
      # points: "[[0.72, 0.52], [0.72, -0.52], [-0.72, -0.52], [-0.72, 0.52]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "polygon"
      points: "[[1.0, 0.8], [1.0, -0.8], [-1.0, -0.8], [-1.0, 0.8]]"
      # points: "[[0.8, 0.58], [0.8, -0.58], [-0.8, -0.58], [-0.8, 0.58]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.2
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      source_timeout: 2.0
      type: "scan"
      topic: "/scan"
      min_height: 0.1                     # ← filters ground returns
      max_height: 0.6
      enabled: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

