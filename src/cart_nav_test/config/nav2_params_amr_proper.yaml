local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0 #2.0
      global_frame: odom
      robot_base_frame: camera_link #base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.6 #0.8 #0.53
      transform_tolerance: 1.0
      # plugins: ["obstacle_layer", "inflation_layer", "voxel_layer"]
      plugins: ["obstacle_layer", "semantic_layer", "inflation_layer"]
      # plugins: ["semantic_layer", "inflation_layer"]
      # plugins: ["voxel_layer", "inflation_layer"]
      semantic_layer:
        plugin: "semantic_costmap_layer::SemanticLayer"
        enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.62 #0.8 #0.30
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /cropbox_filtered_cloud
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          raytrace_max_range: 6.0 #5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0 #5.0
          obstacle_min_range: 0.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        # scan:
      #     topic: /cropbox_filtered_cloud
      #     min_obstacle_height: 0.1
      #     max_obstacle_height: 0.6
      #     clearing: true
      #     marking: true
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 5.0
      #     raytrace_min_range: 0.0
      #     obstacle_max_range: 5.0
      #     obstacle_min_range: 0.0
        scan:
          topic: /camera/points
          min_obstacle_height: 0.1
          max_obstacle_height: 0.6
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 6.0 #5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0 #5.0
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0 #1.0
      publish_frequency: 2.0 #1.0
      global_frame: map  #odom
      robot_base_frame: camera_link #base_link
      transform_tolerance: 1.0 #0.5
      robot_radius: 0.6 #0.25
      resolution: 0.05
      track_unknown_space: true
      # track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /passthrough_filtered_cloud
          min_obstacle_height: 0.1
          max_obstacle_height: 0.6
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 10.0 #5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0 #5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        transform_tolerance: 0.5 #0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.62
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    action_server_result_timeout: 40.0 # timeout in 40 seconds
    global_frame: map
    robot_base_frame: camera_link #base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5
    filter_duration: 0.3
    default_nav_to_pose_bt_xml: "/home/kong/cart_nav_test/src/cart_nav_test/config/custom_bt.xml"
    default_nav_through_poses_bt_xml: "/home/kong/cart_nav_test/src/cart_nav_test/config/custom_bt.xml"
    # default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    always_reload_bt_xml: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - spin
      - route
      - wait

