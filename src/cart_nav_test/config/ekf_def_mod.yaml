ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0 #50.0              
    sensor_timeout: 0.1          
    two_d_mode: true             
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint  #base_link #
    world_frame: odom

    transform_time_offset: 0.0
    transform_timeout: 0.0

    publish_tf: true    
    publish_acceleration: false

    odom0: odom
    # odom0_config: [
    #   true,  true,  false,    # x, y, z
    #   false, false, true,    # roll, pitch, yaw
    #   true,  true,  false,    # vx, vy, vz
    #   false, false, true,     # vroll, vpitch, vyaw
    #   false, false, false     # ax, ay, az
    # ]
    # odom0_config: [ # for imu fusion only, use position
    #   true, true, false,
    #   false, false, true, 
    #   true, false, false,
    #   false, false, true, 
    #   true, false, false 
    # ]
    odom0_config: [
      true, true, false,
      false, false, true,
      true,  false,  false,
      false, false, true, 
      false, false, false 
    ]

    odom0_differential: false
    odom0_relative: false
    # odom0_queue_size: 10
    # odom0_nodelay: false
    # odom0_remove_gravitational_acceleration: false

    odom1: /odometry/gps
    odom1_config: [
      true,  true,  false,
      false, false, false, 
      false, false, false,
      false, false, false, 
      false, false, false 
    ]
    odom1_differential: false
    odom1_relative: false
    # odom1_queue_size: 10
    # odom1_nodelay: false
    # odom1_remove_gravitational_acceleration: false

    imu0: imu
    # imu0_config: [
    #   false, false, false,    # x, y, z 
    #   false, false, false,    # roll, pitch, yaw   
    #   false, false, false,    # vx, vy, vz         
    #   true,  true,  true,     # vroll, vpitch, vyaw
    #   true,  false, false     # ax, ay, az         
    # ]
    # imu0_config: [
    #   false, false, false,
    #   false, false, true,
    #   false, false, false,
    #   false, false, true, 
    #   false, false, false 
    # ]
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true, 
      true, false, false 
    ]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
    # imu0_queue_size: 10
    # imu0_nodelay: false

    # ─── Process Noise Covariance ─────────────────────────────
    # Q matrix — how much we trust the motion model prediction
    # Order: x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
