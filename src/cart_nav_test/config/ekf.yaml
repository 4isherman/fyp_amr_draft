ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: odom
    imu0: imu

    publish_tf: true

    # odom0_config: [true,  true,  false,
    #               false, false, true,
    #               true,  true,  false,
    #               false, false, true,
    #               false, false, false]
    odom0_config: [
      true,  true,  false,    # x, y, z          → fuse x/y position
      false, false, true,    # roll, pitch, yaw  → let IMU handle rotation
      true,  true,  false,    # vx, vy, vz        → fuse linear velocity
      false, false, true,     # vroll, vpitch, vyaw → fuse angular velocity from wheels
      false, false, false     # ax, ay, az        → don't fuse acceleration
    ]
      #        [x_pos   , y_pos    , z_pos,
      #         roll    , pitch    , yaw,
      #         x_vel   , y_vel    , z_vel,
      #         roll_vel, pitch_vel, yaw_vel,
      #         x_accel , y_accel  , z_accel]

    imu0_config: [
      false, false, false, 
      false, false, false, 
      false, false, false, 
      true,  true,  true,  
      true,  false, false  
    ]
      #        [x_pos   , y_pos    , z_pos,
      #         roll    , pitch    , yaw,
      #         x_vel   , y_vel    , z_vel,
      #         roll_vel, pitch_vel, yaw_vel,
      #         x_accel , y_accel  , z_accel]

    # imu0_remove_gravitational_acceleration: true

    # odom0_queue_size: 10
    # imu0_queue_size: 10